<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastQuote Decal - Kalkulator Pro System</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b0b0c; background-image: radial-gradient(circle at 50% 30%, #1c1c1f 0%, #0b0b0c 70%); color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 30px 15px; }
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-logo { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: #ffffff; text-shadow: 0 0 10px rgba(255, 69, 0, 0.3); display: inline-block; }
        .brand-logo span { color: #ff4500; }
        .brand-stripe { width: 80px; height: 4px; background: linear-gradient(90deg, #ff4500, #ffaa00); margin: 8px auto 0 auto; border-radius: 2px; transform: skewX(-20deg); }
        .container, .history-container { background-color: #131316; padding: 25px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); width: 100%; max-width: 580px; border: 1px solid #222226; margin-bottom: 25px; position: relative; }
        .container::before { content: ''; position: absolute; top: 0; left: 30px; right: 30px; height: 2px; background: linear-gradient(90deg, transparent, #ff4500, transparent); }
        .form-group { margin-bottom: 14px; }
        .row-3 { display: flex; gap: 12px; }
        .col { flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 11px; color: #8e8e93; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #2c2c30; background-color: #1c1c1f; color: #fff; border-radius: 8px; font-size: 15px; outline: none; transition: all 0.2s ease; }
        input:focus, select:focus { border-color: #ff4500; box-shadow: 0 0 8px rgba(255, 69, 0, 0.2); background-color: #222226; }
        .input-nama { border-left: 3px solid #ff4500; font-weight: 600; }
        .checkbox-group { display: flex; align-items: center; background: #1c1c1f; padding: 12px; border-radius: 8px; border: 1px solid #2c2c30; margin-top: 10px; cursor: pointer; user-select: none; transition: 0.2s; }
        .checkbox-group input { width: auto; margin-right: 12px; transform: scale(1.3); accent-color: #ff4500; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-size: 13px; color: #e5e5ea; }
        .result-box { background-color: #0b0b0c; padding: 18px; margin-top: 20px; border-radius: 8px; border: 1px solid #2c2c30; border-left: 4px solid #ff4500; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: #aeaeaf; }
        .result-title { font-size: 11px; color: #8e8e93; text-transform: uppercase; margin-top: 5px; letter-spacing: 0.5px; }
        .result-value-jual { font-size: 34px; font-weight: 800; color: #30d158; margin-top: 2px; text-shadow: 0 0 10px rgba(48, 209, 88, 0.1); }
        .btn-copy { width: 100%; padding: 14px; background: linear-gradient(135deg, #ff4500, #ff6200); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 18px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3); transition: all 0.2s; }
        .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255, 69, 0, 0.4); }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #2c2c30; padding-bottom: 10px; }
        .history-header h3 { color: #ff4500; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-clear { padding: 6px 12px; background-color: #1c1c1f; color: #ff453a; border: 1px solid #2c2c30; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 700; text-transform: uppercase; }
        .btn-clear:hover { background-color: #ff453a; color: #fff; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #1c1c1f; white-space: nowrap; }
        th { background-color: #0b0b0c; color: #8e8e93; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
        tr:hover { background-color: #1c1c1f; }
        .row-total-summary { background-color: #0b0b0c !important; font-weight: bold; border-top: 2px solid #2c2c30; }
        .text-green { color: #30d158; font-weight: 700; }
        .text-orange { color: #ff9f0a; font-weight: 700; }
        .text-time { color: #8e8e93; font-size: 11px; }
        .no-data { text-align: center; color: #48484a; padding: 30px 0; font-style: italic; }
    </style>
</head>
<body>

<div class="brand-header">
    <div class="brand-logo">FastQuote <span>Decal</span></div>
    <div class="brand-stripe"></div>
</div>

<div class="container">
    <div class="form-group">
        <label for="nama-order">Nama Konsumen / Orderan</label>
        <input type="text" id="nama-order" class="input-nama" placeholder="Contoh: Honda CRF Dani" oninput="hitungTotal()">
    </div>

    <div class="row-3">
        <div class="col form-group">
            <label for="lebar">Lebar (cm)</label>
            <input type="number" id="lebar" placeholder="124" oninput="hitungTotal()">
        </div>
        <div class="col form-group">
            <label for="panjang">Panjang (cm)</label>
            <input type="number" id="panjang" placeholder="80" oninput="hitungTotal()">
        </div>
        <div class="col form-group">
            <label for="jumlah">Jumlah (Qty)</label>
            <input type="number" id="jumlah" value="1" min="1" oninput="hitungTotal()">
        </div>
    </div>

    <div class="form-group">
        <label for="bahan">Pilih Bahan</label>
        <select id="bahan" onchange="updateLaminasiOptions()"></select>
    </div>

    <div class="form-group">
        <label for="laminasi">Pilih Jenis Laminasi</label>
        <select id="laminasi" onchange="hitungTotal()"></select>
    </div>

    <div class="row-3" style="margin-top: 5px;">
        <div class="col form-group" style="flex: 1.3;">
            <label for="margin">Mark-up Untung (%)</label>
            <input type="number" id="margin" value="30" min="0" oninput="hitungTotal()">
        </div>
        <div class="col" style="flex: 2; display: flex; align-items: flex-end;">
            <div class="checkbox-group" onclick="toggleCheckbox()" style="width: 100%; margin-top: 0; padding: 11px;">
                <input type="checkbox" id="cutting" onchange="hitungTotal()" onclick="event.stopPropagation()">
                <label for="cutting" style="font-size: 12px; font-weight: 600;">Pakai Cutting (+Rp2)</label>
            </div>
        </div>
    </div>
    
    <div class="result-box">
        <div class="result-row">
            <span>Luas Total:</span>
            <span id="luas-info">0 cm²</span>
        </div>
        <div class="result-row" style="color: #ff9f0a;">
            <span>Modal Intern Toko:</span>
            <span id="total-modal">Rp 0</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #2c2c30; margin: 8px 0;">
        <div class="result-title">Harga Jual Akhir Ke Konsumen</div>
        <div class="result-value-jual" id="total-harga-jual">Rp 0</div>
    </div>

    <button class="btn-copy" onclick="salinRincianDanSimpan()">📋 Salin Rincian & Simpan</button>
</div>

<div class="history-container">
    <div class="history-header">
        <h3>📋 Log Riwayat Cetak</h3>
        <button class="btn-clear" onclick="hapusSemuaRiwayat()">🗑️ Hapus Semua</button>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama Orderan</th>
                    <th>Bahan & Lapisan</th>
                    <th>Ukuran (Qty)</th>
                    <th>Modal</th>
                    <th>Harga Jual</th>
                </tr>
            </thead>
            <tbody id="log-riwayat"></tbody>
            <tfoot id="tfoot-total"></tfoot>
        </table>
    </div>
</div>

<script>
    const dataHarga = {
        "MAXDECAL APV80": [{ n: "NON LAPISAN", h: 8.5 }, { n: "100GR Glosy/Doff", h: 10 }, { n: "120GR Glosy/Doff", h: 10.5 }, { n: "180 GSM", h: 15.5 }, { n: "VPF 100", h: 14 }, { n: "VPF500", h: 23.5 }, { n: "Gliter Doff", h: 15.5 }, { n: "Inflex SG 100", h: 12.5 }],
        "MAXDECAL HIGHGRIP": [{ n: "NON LAPISAN", h: 13.5 }, { n: "100GR Glosy/Doff", h: 15 }, { n: "120GR Glosy/Doff", h: 15.5 }, { n: "180 GSM", h: 20.5 }, { n: "VPF 100", h: 19 }, { n: "VPF500", h: 28.5 }, { n: "Gliter Doff", h: 20.5 }, { n: "Inflex SG 100", h: 17.5 }],
        "HOLOGRAM MAXDECAL": [{ n: "NON LAPISAN", h: 20 }, { n: "100GR Glosy/Doff", h: 21.5 }, { n: "120GR Glosy/Doff", h: 22 }, { n: "180 GSM", h: 27 }, { n: "VPF 100", h: 25.5 }, { n: "VPF500", h: 35 }, { n: "Gliter Doff", h: 27 }, { n: "Inflex SG 100", h: 24 }],
        "CHROME MAXDECAL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "LMP MAXDECAL": [{ n: "NON LAPISAN", h: 6.5 }, { n: "100GR Glosy/Doff", h: 8 }, { n: "120GR Glosy/Doff", h: 8.5 }, { n: "180 GSM", h: 13.5 }, { n: "VPF 100", h: 12 }, { n: "VPF500", h: 21.5 }, { n: "Gliter Doff", h: 13.5 }, { n: "Inflex SG 100", h: 10.5 }],
        "NON LABEL KINTECH/VTECH": [{ n: "NON LAPISAN", h: 5.5 }, { n: "100GR Glosy/Doff", h: 7 }, { n: "120GR Glosy/Doff", h: 7.5 }, { n: "180 GSM", h: 12.5 }, { n: "VPF 100", h: 11 }, { n: "VPF500", h: 20.5 }, { n: "Gliter Doff", h: 12.5 }, { n: "Inflex SG 100", h: 9.5 }],
        "INFLEX": [{ n: "NON LAPISAN", h: 7 }, { n: "100GR Glosy/Doff", h: 8.5 }, { n: "120GR Glosy/Doff", h: 9 }, { n: "180 GSM", h: 14 }, { n: "VPF 100", h: 12.5 }, { n: "VPF500", h: 22 }, { n: "Gliter Doff", h: 14 }, { n: "Inflex SG 100", h: 11 }],
        "HOLOGRAM NON LABEL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "CHROME NON LABEL": [{ n: "NON LAPISAN", h: 11 }, { n: "100GR Glosy/Doff", h: 12.5 }, { n: "120GR Glosy/Doff", h: 13 }, { n: "180 GSM", h: 18 }, { n: "VPF 100", h: 16.5 }, { n: "VPF500", h: 26 }, { n: "Gliter Doff", h: 18 }, { n: "Inflex SG 100", h: 15 }],
        "ORACAL STABILO": [{ n: "NON LAPISAN", h: 35 }, { n: "100GR Glosy/Doff", h: 36.5 }, { n: "120GR Glosy/Doff", h: 37 }, { n: "180 GSM", h: 42 }, { n: "VPF 100", h: 40.5 }, { n: "VPF500", h: 50 }, { n: "Gliter Doff", h: 42 }, { n: "Inflex SG 100", h: 39 }],
        "PHOTO PAPER LUSTER": [{ n: "NON LAPISAN", h: 8 }, { n: "100GR Glosy/Doff", h: 9.5 }, { n: "120GR Glosy/Doff", h: 10 }],
        "TRANSPARAN MAXDECAL": [{ n: "UV DOFF", h: 15 }, { n: "UV GLOSY", h: 17 }],
        "TRANSPARAN INFLEX": [{ n: "UV DOFF", h: 13 }, { n: "UV GLOSY", h: 15 }]
    };

    let daftarRiwayat = [];
    const fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

    const bSelect = document.getElementById('bahan');
    for (let b in dataHarga) {
        let opt = document.createElement('option');
        opt.value = b; opt.text = b;
        bSelect.appendChild(opt);
    }

    function updateLaminasiOptions() {
        const bTerpilih = document.getElementById('bahan').value;
        const lamSelect = document.getElementById('laminasi');
        const savedLamIndex = localStorage.getItem('decal_laminasi_index') || 0;
        
        lamSelect.innerHTML = '';
        dataHarga[bTerpilih].forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.h;
            opt.text = `${item.n} (Rp ${item.h})`;
            lamSelect.appendChild(opt);
        });

        if(lamSelect.options[savedLamIndex]) lamSelect.selectedIndex = savedLamIndex;
        hitungTotal();
    }

    function toggleCheckbox() {
        const cb = document.getElementById('cutting');
        cb.checked = !cb.checked;
        hitungTotal();
    }

    let teksNotaClient = "";
    let currentDataRecord = {};

    function hitungTotal() {
        const nama = document.getElementById('nama-order').value || "Tanpa Nama";
        const lb = parseFloat(document.getElementById('lebar').value) || 0;
        const pj = parseFloat(document.getElementById('panjang').value) || 0;
        const qty = parseInt(document.getElementById('jumlah').value) || 1;
        const marginPct = parseFloat(document.getElementById('margin').value) || 0;
        
        const bText = document.getElementById('bahan').value;
        const lamSelect = document.getElementById('laminasi');
        const lamText = lamSelect.options[lamSelect.selectedIndex]?.text.split(' (')[0] || "";
        
        let hDasar = parseFloat(lamSelect.value) || 0;
        const cbCutting = document.getElementById('cutting').checked;

        const luas = lb * pj;
        if (cbCutting) hDasar += 2;
        
        const modalTotal = luas * hDasar * qty;
        const untung = modalTotal * (marginPct / 100);
        const hargaJualTotal = modalTotal + untung;

        document.getElementById('luas-info').innerText = `${luas.toLocaleString('id-ID')} cm² x ${qty} pcs`;
        document.getElementById('total-modal').innerText = fmt.format(modalTotal);
        document.getElementById('total-harga-jual').innerText = fmt.format(hargaJualTotal);

        currentDataRecord = {
            nama: nama, bahan: bText, laminasi: lamText + (cbCutting ? ' + Cut' : ''), dimensi: `${lb}x${pj} (${qty})`, numModal: modalTotal, numJual: hargaJualTotal
        };

        teksNotaClient = `*FASTQUOTE DECAL - NOTA PEMESANAN*\n-----------------------------------------\n• Konsumen     : ${nama}\n• Jenis Bahan  : ${bText}\n• Finishing     : ${lamText}\n• Ukuran        : ${lb} cm x ${pj} cm\n• Cutting       : ${cbCutting ? 'Ya' : 'Tidak'}\n• Jumlah        : ${qty} pcs\n-----------------------------------------\n*Total Biaya:* ${fmt.format(hargaJualTotal)}\n\nTerima kasih! 🙏`;
    }

    function salinRincianDanSimpan() {
        if (!document.getElementById('lebar').value || !document.getElementById('panjang').value) { alert("Isi ukuran stiker!"); return; }
        navigator.clipboard.writeText(teksNotaClient).then(() => {
            const sekarang = new Date();
            const jamStr = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const recordBaru = { waktu: jamStr, ...currentDataRecord };
            daftarRiwayat.unshift(recordBaru);
            localStorage.setItem('fastquote_history', JSON.stringify(daftarRiwayat));
            renderTabelRiwayat();
            alert(`Nota "${recordBaru.nama}" berhasil disalin!`);
        });
    }

    function renderTabelRiwayat() {
        const tbody = document.getElementById('log-riwayat');
        const tfoot = document.getElementById('tfoot-total');
        tbody.innerHTML = ''; tfoot.innerHTML = '';
        if (daftarRiwayat.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="no-data">Belum ada transaksi.</td></tr>`; return; }
        let rekapModal = 0; let rekapJual = 0;
        daftarRiwayat.forEach(item => {
            rekapModal += item.numModal; rekapJual += item.numJual;
            let row = document.createElement('tr');
            row.innerHTML = `<td class="text-time">${item.waktu}</td><td style="color:#ff4500;font-weight:600;">${item.nama}</td><td><strong>${item.bahan}</strong><br><small style="color:#8e8e93">${item.laminasi}</small></td><td>${item.dimensi}</td><td class="text-orange">${fmt.format(item.numModal)}</td><td class="text-green">${fmt.format(item.numJual)}</td>`;
            tbody.appendChild(row);
        });
        let footerRow = document.createElement('tr');
        footerRow.className = "row-total-summary";
        footerRow.innerHTML = `<td colspan="4" style="text-align:right;padding:14px 10px;">🔥 TOTAL REKAP :</td><td class="text-orange" style="padding:14px 10px;">${fmt.format(rekapModal)}</td><td class="text-green" style="padding:14px 10px;">${fmt.format(rekapJual)}</td>`;
        tfoot.appendChild(footerRow);
    }

    function hapusSemuaRiwayat() { if (confirm("Hapus semua riwayat?")) { daftarRiwayat = []; localStorage.removeItem('fastquote_history'); renderTabelRiwayat(); } }
    window.onload = function() { const riwayatLama = localStorage.getItem('fastquote_history'); if (riwayatLama) daftarRiwayat = JSON.parse(riwayatLama); renderTabelRiwayat(); updateLaminasiOptions(); }
</script>
</body>
</html>
