<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Decal - Premium Calculator System</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #060608; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.2) 0%, transparent 60%),
                linear-gradient(180deg, #060608 0%, #0d0d12 100%);
            color: #e2e2e9; 
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 16px;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            min-height: 100vh; 
            padding: 30px 12px; 
        }

        /* Header Bergaya Striping Motor Sport */
        .brand-header { text-align: center; margin-bottom: 25px; position: relative; width: 100%; max-width: 520px;}
        .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; line-height: 1; }
        .brand-logo span { color: #ff4500; text-shadow: 0 0 20px rgba(255, 69, 0, 0.7); }
        .brand-tagline { font-size: 11px; text-transform: uppercase; letter-spacing: 5px; color: #5a5a6e; margin-top: 6px; font-weight: 700; }
        
        /* Badging Akselerasi Garis */
        .brand-stripes { display: flex; justify-content: center; gap: 4px; margin-top: 10px; transform: skewX(-25deg); }
        .stripe-l { width: 40px; height: 4px; background: #ff4500; }
        .stripe-s { width: 12px; height: 4px; background: #ffaa00; }

        /* Container Utama dengan Efek Carbon Dark Panel */
        .container, .history-container { 
            background: linear-gradient(145deg, #101015 0%, #09090d 100%);
            border: 1px solid rgba(255, 69, 0, 0.15);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.05); 
            width: 100%; 
            max-width: 520px; 
            margin-bottom: 25px; 
            position: relative;
        }

        /* Garis kilau oranye di atas panel */
        .container::before {
            content: ''; position: absolute; top: -1px; left: 30px; right: 30px; height: 2px;
            background: linear-gradient(90deg, transparent, #ff4500, #ffaa00, transparent);
        }

        .form-group { margin-bottom: 16px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        label { display: block; margin-bottom: 6px; font-size: 12px; color: #8a8a9e; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Input & Select dengan sudut tegas & list neon */
        input, select { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #1f1f27; 
            background-color: #0b0b0f; 
            color: #fff; 
            border-radius: 8px; 
            font-size: 16px; 
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            outline: none; 
            transition: all 0.25s ease;
        }
        
        input:focus, select:focus { 
            border-color: #ff4500; 
            background-color: #111116;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.25);
        }

        .input-nama { border-left: 4px solid #ff4500; font-size: 17px; letter-spacing: 0.5px; }
        
        .search-bahan { 
            border-left: 4px solid #ffaa00;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23ffaa00" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>'); 
            background-repeat: no-repeat; 
            background-position: right 14px center;
            padding-right: 38px;
        }

        select[size] { min-height: 120px; padding: 4px; scrollbar-width: thin; }
        select[size] option { padding: 8px 10px; border-radius: 6px; margin-bottom: 3px; cursor: pointer; transition: 0.1s; }
        select[size] option:checked { background: linear-gradient(90deg, #ff4500, #ff8000) !important; color: white; font-weight: 700; }

        /* Checkbox Modern Custom-look */
        .checkbox-group { 
            display: flex; 
            align-items: center; 
            background: #0b0b0f; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #1f1f27; 
            cursor: pointer; 
            user-select: none; 
            transition: 0.2s; 
        }
        .checkbox-group:hover { border-color: rgba(255, 69, 0, 0.4); background: #111116; }
        .checkbox-group input { width: auto; margin-right: 12px; transform: scale(1.3); accent-color: #ff4500; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; cursor: pointer; font-size: 14px; color: #e2e2e9; text-transform: none; letter-spacing: 0; }

        /* Panel Dashboard Speedometer untuk Tampilan Harga */
        .result-box { 
            background: #07070a;
            padding: 20px; 
            margin-top: 22px; 
            border-radius: 12px; 
            border: 1px solid #1f1f27;
            position: relative;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #7e7e8f; }
        .result-row span:last-child { font-weight: 700; color: #ffffff; }
        
        .result-title { font-size: 11px; color: #8a8a9e; text-transform: uppercase; margin-top: 12px; letter-spacing: 1.5px; font-weight: 700; text-align: center;}
        
        /* Angka Jual Utama Bergaya Digital Spidometer */
        .result-value-jual { 
            font-family: 'Orbitron', sans-serif;
            font-size: 38px; 
            font-weight: 900; 
            color: #30d158; 
            text-align: center;
            margin-top: 4px; 
            letter-spacing: -1px;
            text-shadow: 0 0 15px rgba(48, 209, 88, 0.4);
        }

        /* Tombol Aksi */
        .action-buttons { display: flex; gap: 12px; margin-top: 22px; }
        .btn-main { 
            flex: 1; 
            padding: 15px; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-family: 'Orbitron', sans-serif;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        
        .btn-copy { background: #1a1a24; border: 1px solid #2d2d3a; color: #c5c5d2; }
        .btn-copy:hover { background: #242432; color: #fff; transform: scale(1.02); }
        
        .btn-wa { background: linear-gradient(135deg, #1cbd59 0%, #128c7e 100%); box-shadow: 0 5px 15px rgba(28, 189, 89, 0.3); }
        .btn-wa:hover { transform: scale(1.02); box-shadow: 0 8px 22px rgba(28, 189, 89, 0.5); }

        /* Tabel Riwayat Cetak */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1f1f27; padding-bottom: 10px; }
        .history-header h3 { color: #ff4500; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; }
        .btn-clear { padding: 4px 10px; background: transparent; color: #ff453a; border: 1px solid rgba(255,69,58,0.2); border-radius: 6px; font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .btn-clear:hover { background: #ff453a; color: #fff; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #0e0e14; white-space: nowrap; }
        th { background-color: #060608; color: #5a5a6e; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        tr:hover { background-color: #12121a; }
        
        .row-total-summary { background-color: #060608 !important; font-weight: bold; border-top: 2px solid #1f1f27; font-size: 14px;}
        .text-green { color: #30d158; font-weight: 700; }
        .text-orange { color: #ff9f0a; font-weight: 700; }
        .text-time { color: #444455; font-size: 12px; }
        .no-data { text-align: center; color: #444455; padding: 25px 0; font-style: italic; }
    </style>
</head>
<body>

<div class="brand-header">
    <div class="brand-logo">Pusat <span>Decal</span></div>
    <div class="brand-tagline">Premium Calculator System</div>
    <div class="brand-stripes">
        <div class="stripe-l"></div>
        <div class="stripe-s"></div>
    </div>
</div>

<div class="container">
    <div class="form-group">
        <label for="nama-order">Nama Konsumen / Orderan</label>
        <input type="text" id="nama-order" class="input-nama" placeholder="Contoh: KAWASAKI KLX DANI" oninput="hitungTotal()">
    </div>

    <div class="grid-3 form-group">
        <div>
            <label for="lebar">Lebar (cm)</label>
            <input type="number" id="lebar" placeholder="124" oninput="hitungTotal()">
        </div>
        <div>
            <label for="panjang">Panjang (cm)</label>
            <input type="number" id="panjang" placeholder="80" oninput="hitungTotal()">
        </div>
        <div>
            <label for="jumlah">Jumlah (Qty)</label>
            <input type="number" id="jumlah" value="1" min="1" oninput="hitungTotal()">
        </div>
    </div>

    <div class="form-group">
        <label for="search-bahan">Cari & Pilih Bahan</label>
        <input type="text" id="search-bahan" class="search-bahan" placeholder="Ketik nama bahan (contoh: chrome, max...)" oninput="filterBahan()">
        <select id="bahan" size="4" style="margin-top: 6px;" onchange="updateLaminasiOptions()"></select>
    </div>

    <div class="form-group">
        <label for="laminasi">Pilih Jenis Laminasi</label>
        <select id="laminasi" onchange="hitungTotal()"></select>
    </div>

    <div class="grid-2 form-group">
        <div>
            <label for="margin">Mark-up Untung (%)</label>
            <input type="number" id="margin" value="30" min="0" oninput="hitungTotal()">
        </div>
        <div>
            <label for="biaya-tambahan">Biaya Desain / Pasang (Rp)</label>
            <input type="number" id="biaya-tambahan" value="0" min="0" placeholder="0" oninput="hitungTotal()">
        </div>
    </div>

    <div class="form-group">
        <div class="checkbox-group" onclick="toggleCheckbox()">
            <input type="checkbox" id="cutting" onchange="hitungTotal()" onclick="event.stopPropagation()">
            <label for="cutting">Pakai Cutting Pola (+Rp2/cm²)</label>
        </div>
    </div>
    
    <div class="result-box">
        <div class="result-row">
            <span>Luas Total Area :</span>
            <span id="luas-info">0 cm²</span>
        </div>
        <div class="result-row">
            <span>Modal Intern Toko :</span>
            <span id="total-modal" class="text-orange">Rp 0</span>
        </div>
        <hr style="border: 0; border-top: 1px dashed #1f1f27; margin: 10px 0;">
        <div class="result-title">Harga Jual Akhir Ke Konsumen</div>
        <div class="result-value-jual" id="total-harga-jual">Rp 0</div>
    </div>

    <div class="action-buttons">
        <button class="btn-main btn-copy" onclick="salinRincianDanSimpan()">📋 Copy Nota</button>
        <button class="btn-main btn-wa" onclick="kirimWhatsApp()">💬 Kirim WA</button>
    </div>
</div>

<div class="history-container">
    <div class="history-header">
        <h3>📋 LOG RIWAYAT CETAK</h3>
        <button class="btn-clear" onclick="hapusSemuaRiwayat()">🗑️ Reset</button>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Waktu</th>
                    <th>Nama Orderan</th>
                    <th>Bahan & Lapisan</th>
                    <th>Dimensi (Qty)</th>
                    <th>Modal</th>
                    <th>Harga Jual</th>
                </tr>
            </thead>
            <tbody id="log-riwayat"></tbody>
            <tfoot id="tfoot-total"></tfoot>
        </table>
    </div>
</div>

<script>
    const dataHarga = {
        "MAXDECAL APV80": [{ n: "NON LAPISAN", h: 8.5 }, { n: "100GR Glosy/Doff", h: 10 }, { n: "120GR Glosy/Doff", h: 10.5 }, { n: "180 GSM", h: 15.5 }, { n: "VPF 100", h: 14 }, { n: "VPF500", h: 23.5 }, { n: "Gliter Doff", h: 15.5 }, { n: "Inflex SG 100", h: 12.5 }],
        "MAXDECAL HIGHGRIP": [{ n: "NON LAPISAN", h: 13.5 }, { n: "100GR Glosy/Doff", h: 15 }, { n: "120GR Glosy/Doff", h: 15.5 }, { n: "180 GSM", h: 20.5 }, { n: "VPF 100", h: 19 }, { n: "VPF500", h: 28.5 }, { n: "Gliter Doff", h: 20.5 }, { n: "Inflex SG 100", h: 17.5 }],
        "HOLOGRAM MAXDECAL": [{ n: "NON LAPISAN", h: 20 }, { n: "100GR Glosy/Doff", h: 21.5 }, { n: "120GR Glosy/Doff", h: 22 }, { n: "180 GSM", h: 27 }, { n: "VPF 100", h: 25.5 }, { n: "VPF500", h: 35 }, { n: "Gliter Doff", h: 27 }, { n: "Inflex SG 100", h: 24 }],
        "CHROME MAXDECAL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "LMP MAXDECAL": [{ n: "NON LAPISAN", h: 6.5 }, { n: "100GR Glosy/Doff", h: 8 }, { n: "120GR Glosy/Doff", h: 8.5 }, { n: "180 GSM", h: 13.5 }, { n: "VPF 100", h: 12 }, { n: "VPF500", h: 21.5 }, { n: "Gliter Doff", h: 13.5 }, { n: "Inflex SG 100", h: 10.5 }],
        "NON LABEL KINTECH/VTECH": [{ n: "NON LAPISAN", h: 5.5 }, { n: "100GR Glosy/Doff", h: 7 }, { n: "120GR Glosy/Doff", h: 7.5 }, { n: "180 GSM", h: 12.5 }, { n: "VPF 100", h: 11 }, { n: "VPF500", h: 20.5 }, { n: "Gliter Doff", h: 12.5 }, { n: "Inflex SG 100", h: 9.5 }],
        "INFLEX": [{ n: "NON LAPISAN", h: 7 }, { n: "100GR Glosy/Doff", h: 8.5 }, { n: "120GR Glosy/Doff", h: 9 }, { n: "180 GSM", h: 14 }, { n: "VPF 100", h: 12.5 }, { n: "VPF500", h: 22 }, { n: "Gliter Doff", h: 14 }, { n: "Inflex SG 100", h: 11 }],
        "HOLOGRAM NON LABEL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "CHROME NON LABEL": [{ n: "NON LAPISAN", h: 11 }, { n: "100GR Glosy/Doff", h: 12.5 }, { n: "120GR Glosy/Doff", h: 13 }, { n: "180 GSM", h: 18 }, { n: "VPF 100", h: 16.5 }, { n: "VPF500", h: 26 }, { n: "Gliter Doff", h: 18 }, { n: "Inflex SG 100", h: 15 }],
        "ORACAL STABILO": [{ n: "NON LAPISAN", h: 35 }, { n: "100GR Glosy/Doff", h: 36.5 }, { n: "120GR Glosy/Doff", h: 37 }, { n: "180 GSM", h: 42 }, { n: "VPF 100", h: 40.5 }, { n: "VPF500", h: 50 }, { n: "Gliter Doff", h: 42 }, { n: "Inflex SG 100", h: 39 }],
        "PHOTO PAPER LUSTER": [{ n: "NON LAPISAN", h: 8 }, { n: "100GR Glosy/Doff", h: 9.5 }, { n: "120GR Glosy/Doff", h: 10 }],
        "TRANSPARAN MAXDECAL": [{ n: "UV DOFF", h: 15 }, { n: "UV GLOSY", h: 17 }],
        "TRANSPARAN INFLEX": [{ n: "UV DOFF", h: 13 }, { n: "UV GLOSY", h: 15 }]
    };

    let daftarRiwayat = [];
    const fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

    function initBahan() {
        filterBahan();
        const bSelect = document.getElementById('bahan');
        if(bSelect.options.length > 0) {
            bSelect.selectedIndex = 0;
            updateLaminasiOptions();
        }
    }

    function filterBahan() {
        const keyword = document.getElementById('search-bahan').value.toLowerCase();
        const bSelect = document.getElementById('bahan');
        bSelect.innerHTML = '';
        
        for (let b in dataHarga) {
            if (b.toLowerCase().includes(keyword)) {
                let opt = document.createElement('option');
                opt.value = b; opt.text = b;
                bSelect.appendChild(opt);
            }
        }
    }

    function updateLaminasiOptions() {
        const bTerpilih = document.getElementById('bahan').value;
        if(!bTerpilih) return;
        const lamSelect = document.getElementById('laminasi');
        
        lamSelect.innerHTML = '';
        dataHarga[bTerpilih].forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.h;
            opt.text = `${item.n} (Rp ${item.h})`;
            lamSelect.appendChild(opt);
        });
        hitungTotal();
    }

    function toggleCheckbox() {
        const cb = document.getElementById('cutting');
        cb.checked = !cb.checked;
        hitungTotal();
    }

    let teksNotaClient = "";
    let currentDataRecord = {};

    function hitungTotal() {
        const nama = document.getElementById('nama-order').value || "Tanpa Nama";
        const lb = parseFloat(document.getElementById('lebar').value) || 0;
        const pj = parseFloat(document.getElementById('panjang').value) || 0;
        const qty = parseInt(document.getElementById('jumlah').value) || 1;
        const marginPct = parseFloat(document.getElementById('margin').value) || 0;
        const biayaTambahan = parseFloat(document.getElementById('biaya-tambahan').value) || 0;
        
        const bText = document.getElementById('bahan').value || "Belum Pilih";
        const lamSelect = document.getElementById('laminasi');
        const lamText = lamSelect.options[lamSelect.selectedIndex]?.text.split(' (')[0] || "";
        
        let hDasar = parseFloat(lamSelect.value) || 0;
        const cbCutting = document.getElementById('cutting').checked;

        const luas = lb * pj;
        if (cbCutting) hDasar += 2;
        
        const modalTotal = (luas * hDasar * qty);
        const untung = modalTotal * (marginPct / 100);
        let hargaJualMurni = modalTotal + untung + biayaTambahan;

        document.getElementById('luas-info').innerText = `${luas.toLocaleString('id-ID')} cm² x ${qty} pcs`;
        document.getElementById('total-modal').innerText = fmt.format(modalTotal);
        document.getElementById('total-harga-jual').innerText = fmt.format(hargaJualMurni);

        currentDataRecord = {
            nama: nama, bahan: bText, laminasi: lamText + (cbCutting ? ' + Cut' : ''), dimensi: `${lb}x${pj} (${qty})`, numModal: modalTotal, numJual: hargaJualMurni
        };

        teksNotaClient = `*PUSAT DECAL - NOTA ORDERAN*\n-----------------------------------------\n• Pelanggan   : ${nama}\n• Tipe Bahan  : ${bText}\n• Lapisan      : ${lamText}\n• Dimensi Ukuran : ${lb} cm x ${pj} cm\n• Cutting Pola  : ${cbCutting ? 'Ya' : 'Tidak'}\n• Kuantitas    : ${qty} pcs\n${biayaTambahan > 0 ? `• Jasa Pasang/Desain : ${fmt.format(biayaTambahan)}\n` : ''}-----------------------------------------\n*TOTAL BILL:* ${fmt.format(hargaJualMurni)}\n\nDiproses dengan sistem digital. Terima kasih! ⚡`;
    }

    function simpanKeRiwayatLokal() {
        const sekarang = new Date();
        const jamStr = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const recordBaru = { waktu: jamStr, ...currentDataRecord };
        daftarRiwayat.unshift(recordBaru);
        localStorage.setItem('pusatdecal_history', JSON.stringify(daftarRiwayat));
        renderTabelRiwayat();
    }

    function salinRincianDanSimpan() {
        if (!document.getElementById('lebar').value || !document.getElementById('panjang').value) { alert("Isi dimensi stiker!"); return; }
        navigator.clipboard.writeText(teksNotaClient).then(() => {
            simpanKeRiwayatLokal();
            alert(`Nota rincian "${currentDataRecord.nama}" disalin!`);
        });
    }

    function kirimWhatsApp() {
        if (!document.getElementById('lebar').value || !document.getElementById('panjang').value) { alert("Isi dimensi stiker!"); return; }
        simpanKeRiwayatLokal();
        const urlWA = `https://api.whatsapp.com/send?text=${encodeURIComponent(teksNotaClient)}`;
        window.open(urlWA, '_blank');
    }

    function renderTabelRiwayat() {
        const tbody = document.getElementById('log-riwayat');
        const tfoot = document.getElementById('tfoot-total');
        tbody.innerHTML = ''; tfoot.innerHTML = '';
        if (daftarRiwayat.length === 0) { tbody.innerHTML = `<tr><td colspan="6" class="no-data">Belum ada rekapan cetak hari ini.</td></tr>`; return; }
        let rekapModal = 0; let rekapJual = 0;
        daftarRiwayat.forEach(item => {
            rekapModal += item.numModal; rekapJual += item.numJual;
            let row = document.createElement('tr');
            row.innerHTML = `<td class="text-time">${item.waktu}</td><td style="color:#ff4500;font-weight:700;">${item.nama}</td><td><strong>${item.bahan}</strong><br><small style="color:#6a6a7e">${item.laminasi}</small></td><td>${item.dimensi}</td><td class="text-orange">${fmt.format(item.numModal)}</td><td class="text-green">${fmt.format(item.numJual)}</td>`;
            tbody.appendChild(row);
        });
        let footerRow = document.createElement('tr');
        footerRow.className = "row-total-summary";
        footerRow.innerHTML = `<td colspan="4" style="text-align:right;padding:12px 10px;">⚡ REKAP TOTAL OMZET :</td><td class="text-orange">${fmt.format(rekapModal)}</td><td class="text-green">${fmt.format(rekapJual)}</td>`;
        tfoot.appendChild(footerRow);
    }

    function hapusSemuaRiwayat() { if (confirm("Kosongkan semua riwayat log cetak?")) { daftarRiwayat = []; localStorage.removeItem('pusatdecal_history'); renderTabelRiwayat(); } }
    window.onload = function() { const riwayatLama = localStorage.getItem('pusatdecal_history'); if (riwayatLama) daftarRiwayat = JSON.parse(riwayatLama); renderTabelRiwayat(); initBahan(); }
</script>
