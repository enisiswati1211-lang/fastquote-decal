<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastQuote Decal - Premium System</title>
    <style>
        /* Gaya CSS Anda tetap sama agar tampilan tidak berubah */
        * { box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #08080a; background-image: radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.15) 0%, transparent 50%), linear-gradient(135deg, #08080a 0%, #111115 100%); color: #f1f1f3; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 15px; }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-logo { font-size: 28px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #ffffff; }
        .brand-logo span { color: #ff4500; }
        .container, .history-container { background: rgba(19, 19, 24, 0.85); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; width: 100%; max-width: 550px; border: 1px solid rgba(255, 255, 255, 0.03); margin-bottom: 25px; }
        .container { border-top: 4px solid #ff4500; }
        .form-group { margin-bottom: 18px; }
        .row-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        label { display: block; margin-bottom: 8px; font-size: 10px; color: #8a8a98; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 14px 16px; border: 1px solid #22222a; background-color: #16161c; color: #fff; border-radius: 10px; font-size: 14px; outline: none; }
        .checkbox-group { display: flex; align-items: center; background: #16161c; padding: 14px 16px; border-radius: 10px; border: 1px solid #22222a; cursor: pointer; }
        .checkbox-group input { width: auto; margin-right: 12px; transform: scale(1.2); accent-color: #ff4500; }
        .result-box { background: linear-gradient(180deg, #16161c 0%, #0d0d12 100%); padding: 22px; margin-top: 25px; border-radius: 14px; border-left: 4px solid #30d158; }
        .action-buttons { display: flex; gap: 12px; margin-top: 25px; }
        .btn-main { flex: 1; padding: 16px; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-wa { background: #25D366; }
        .btn-copy { background: #22222a; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #16161c; }
        .text-green { color: #30d158; font-weight: 700; }
        .text-orange { color: #ff9f0a; font-weight: 700; }
    </style>
</head>
<body>

<div class="brand-header">
    <div class="brand-logo">FastQuote <span>Decal</span></div>
</div>

<div class="container">
    <div class="form-group"><label>Nama Konsumen</label><input type="text" id="nama-order" oninput="hitungTotal()"></div>
    <div class="row-grid form-group">
        <div><label>Lebar</label><input type="number" id="lebar" oninput="hitungTotal()"></div>
        <div><label>Panjang</label><input type="number" id="panjang" oninput="hitungTotal()"></div>
        <div><label>Qty</label><input type="number" id="jumlah" value="1" oninput="hitungTotal()"></div>
    </div>
    <div class="form-group">
        <label>Cari Bahan</label>
        <input type="text" id="search-bahan" placeholder="Ketik nama bahan..." oninput="filterBahan()">
        <select id="bahan" size="4" style="margin-top: 8px;" onchange="updateLaminasiOptions()"></select>
    </div>
    <div class="form-group"><label>Pilih Jenis Laminasi</label><select id="laminasi" onchange="hitungTotal()"></select></div>
    <div class="form-group">
        <div class="checkbox-group" onclick="toggleCheckbox()">
            <input type="checkbox" id="cutting" onchange="hitungTotal()" onclick="event.stopPropagation()">
            <label style="margin:0;">Pakai Cutting Pola (+Rp2/cm²)</label>
        </div>
    </div>
    <div class="result-box">
        <div class="result-title" style="color:#8a8a98;">HARGA JUAL AKHIR</div>
        <div class="result-value-jual" id="total-harga-jual" style="font-size:30px; font-weight:900; color:#30d158;">Rp 0</div>
    </div>
    <div class="action-buttons">
        <button class="btn-main btn-copy" onclick="salinRincianDanSimpan()">📋 Salin</button>
        <button class="btn-main btn-wa" onclick="kirimWhatsApp()">💬 WA</button>
    </div>
</div>

<div class="history-container">
    <div class="history-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3>📋 Log Riwayat</h3>
        <button onclick="hapusSemuaRiwayat()" style="background:none; border:none; color:#ff4500; cursor:pointer;">🗑️ Clear</button>
    </div>
    <div class="row-split" style="margin-bottom:15px;">
        <input type="text" id="filter-nama" placeholder="Filter Nama..." oninput="renderTabelRiwayat()">
        <input type="month" id="filter-bulan" oninput="renderTabelRiwayat()">
    </div>
    <table>
        <thead><tr><th>Waktu</th><th>Nama</th><th>Jual</th></tr></thead>
        <tbody id="log-riwayat"></tbody>
        <tfoot id="tfoot-total"></tfoot>
    </table>
</div>

<script>
    const dataHarga = {
        "MAXDECAL APV80": [{ n: "NON LAPISAN", h: 8.5 }, { n: "100GR Glosy/Doff", h: 10 }, { n: "120GR Glosy/Doff", h: 10.5 }, { n: "180 GSM", h: 15.5 }, { n: "VPF 100", h: 14 }, { n: "VPF500", h: 23.5 }, { n: "Gliter Doff", h: 15.5 }, { n: "Inflex SG 100", h: 12.5 }],
        "MAXDECAL HIGHGRIP": [{ n: "NON LAPISAN", h: 13.5 }, { n: "100GR Glosy/Doff", h: 15 }, { n: "120GR Glosy/Doff", h: 15.5 }, { n: "180 GSM", h: 20.5 }, { n: "VPF 100", h: 19 }, { n: "VPF500", h: 28.5 }, { n: "Gliter Doff", h: 20.5 }, { n: "Inflex SG 100", h: 17.5 }],
        "HOLOGRAM MAXDECAL": [{ n: "NON LAPISAN", h: 20 }, { n: "100GR Glosy/Doff", h: 21.5 }, { n: "120GR Glosy/Doff", h: 22 }, { n: "180 GSM", h: 27 }, { n: "VPF 100", h: 25.5 }, { n: "VPF500", h: 35 }, { n: "Gliter Doff", h: 27 }, { n: "Inflex SG 100", h: 24 }],
        "CHROME MAXDECAL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "LMP MAXDECAL": [{ n: "NON LAPISAN", h: 6.5 }, { n: "100GR Glosy/Doff", h: 8 }, { n: "120GR Glosy/Doff", h: 8.5 }, { n: "180 GSM", h: 13.5 }, { n: "VPF 100", h: 12 }, { n: "VPF500", h: 21.5 }, { n: "Gliter Doff", h: 13.5 }, { n: "Inflex SG 100", h: 10.5 }],
        "NON LABEL KINTECH/VTECH": [{ n: "NON LAPISAN", h: 5.5 }, { n: "100GR Glosy/Doff", h: 7 }, { n: "120GR Glosy/Doff", h: 7.5 }, { n: "180 GSM", h: 12.5 }, { n: "VPF 100", h: 11 }, { n: "VPF500", h: 20.5 }, { n: "Gliter Doff", h: 12.5 }, { n: "Inflex SG 100", h: 9.5 }],
        "INFLEX": [{ n: "NON LAPISAN", h: 7 }, { n: "100GR Glosy/Doff", h: 8.5 }, { n: "120GR Glosy/Doff", h: 9 }, { n: "180 GSM", h: 14 }, { n: "VPF 100", h: 12.5 }, { n: "VPF500", h: 22 }, { n: "Gliter Doff", h: 14 }, { n: "Inflex SG 100", h: 11 }],
        "HOLOGRAM NON LABEL": [{ n: "NON LAPISAN", h: 15 }, { n: "100GR Glosy/Doff", h: 16.5 }, { n: "120GR Glosy/Doff", h: 17 }, { n: "180 GSM", h: 22 }, { n: "VPF 100", h: 20.5 }, { n: "VPF500", h: 30 }, { n: "Gliter Doff", h: 22 }, { n: "Inflex SG 100", h: 19 }],
        "CHROME NON LABEL": [{ n: "NON LAPISAN", h: 11 }, { n: "100GR Glosy/Doff", h: 12.5 }, { n: "120GR Glosy/Doff", h: 13 }, { n: "180 GSM", h: 18 }, { n: "VPF 100", h: 16.5 }, { n: "VPF500", h: 26 }, { n: "Gliter Doff", h: 18 }, { n: "Inflex SG 100", h: 15 }],
        "ORACAL STABILO": [{ n: "NON LAPISAN", h: 35 }, { n: "100GR Glosy/Doff", h: 36.5 }, { n: "120GR Glosy/Doff", h: 37 }, { n: "180 GSM", h: 42 }, { n: "VPF 100", h: 40.5 }, { n: "VPF500", h: 50 }, { n: "Gliter Doff", h: 42 }, { n: "Inflex SG 100", h: 39 }],
        "PHOTO PAPER LUSTER": [{ n: "NON LAPISAN", h: 8 }, { n: "100GR Glosy/Doff", h: 9.5 }, { n: "120GR Glosy/Doff", h: 10 }],
        "TRANSPARAN MAXDECAL": [{ n: "UV DOFF", h: 15 }, { n: "UV GLOSY", h: 17 }],
        "TRANSPARAN INFLEX": [{ n: "UV DOFF", h: 13 }, { n: "UV GLOSY", h: 15 }]
    };

    let daftarRiwayat = JSON.parse(localStorage.getItem('fastquote_history') || '[]');
    const fmt = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

    function filterBahan() {
        const keyword = document.getElementById('search-bahan').value.toLowerCase();
        const bSelect = document.getElementById('bahan');
        bSelect.innerHTML = '';
        for (let b in dataHarga) {
            if (b.toLowerCase().includes(keyword)) {
                let opt = document.createElement('option');
                opt.value = b; opt.text = b;
                bSelect.appendChild(opt);
            }
        }
    }

    function updateLaminasiOptions() {
        const bTerpilih = document.getElementById('bahan').value;
        if(!bTerpilih) return;
        const lamSelect = document.getElementById('laminasi');
        lamSelect.innerHTML = '';
        dataHarga[bTerpilih].forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.h;
            opt.text = `${item.n} (Rp ${item.h})`;
            lamSelect.appendChild(opt);
        });
        hitungTotal();
    }

    function toggleCheckbox() { document.getElementById('cutting').checked = !document.getElementById('cutting').checked; hitungTotal(); }

    function hitungTotal() {
        const lb = parseFloat(document.getElementById('lebar').value) || 0;
        const pj = parseFloat(document.getElementById('panjang').value) || 0;
        const qty = parseInt(document.getElementById('jumlah').value) || 1;
        let hDasar = parseFloat(document.getElementById('laminasi').value) || 0;
        if (document.getElementById('cutting').checked) hDasar += 2;
        const total = (lb * pj * hDasar * qty);
        document.getElementById('total-harga-jual').innerText = fmt.format(total);
        return { total, bText: document.getElementById('bahan').value, lamText: document.getElementById('laminasi').options[document.getElementById('laminasi').selectedIndex]?.text };
    }

    function simpanKeRiwayatLokal() {
        const data = hitungTotal();
        const sekarang = new Date();
        const record = {
            tgl: sekarang.toISOString().split('T')[0],
            waktu: sekarang.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}),
            nama: document.getElementById('nama-order').value || "Tanpa Nama",
            total: data.total
        };
        daftarRiwayat.unshift(record);
        localStorage.setItem('fastquote_history', JSON.stringify(daftarRiwayat));
        renderTabelRiwayat();
    }

    function renderTabelRiwayat() {
        const nFilter = document.getElementById('filter-nama').value.toLowerCase();
        const bFilter = document.getElementById('filter-bulan').value;
        const tbody = document.getElementById('log-riwayat');
        tbody.innerHTML = '';
        let totalJual = 0;
        daftarRiwayat.filter(i => i.nama.toLowerCase().includes(nFilter) && (bFilter ? i.tgl.startsWith(bFilter) : true))
        .forEach(i => {
            totalJual += i.total;
            tbody.innerHTML += `<tr><td>${i.waktu}</td><td>${i.nama}</td><td class="text-green">${fmt.format(i.total)}</td></tr>`;
        });
        document.getElementById('tfoot-total').innerHTML = `<tr><td colspan="2">TOTAL</td><td class="text-orange">${fmt.format(totalJual)}</td></tr>`;
    }

    function salinRincianDanSimpan() { simpanKeRiwayatLokal(); alert("Data tersimpan!"); }
    function kirimWhatsApp() { simpanKeRiwayatLokal(); window.open(`https://api.whatsapp.com/send?text=Total Biaya: ${document.getElementById('total-harga-jual').innerText}`, '_blank'); }
    function hapusSemuaRiwayat() { if(confirm("Hapus semua?")) { daftarRiwayat = []; localStorage.removeItem('fastquote_history'); renderTabelRiwayat(); } }

    window.onload = () => { filterBahan(); updateLaminasiOptions(); renderTabelRiwayat(); };
</script>
</body>
</html>
