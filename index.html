<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastQuote Decal - Pro System</title>
    <style>
        body { background-color: #08080a; color: #f1f1f3; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container, .history-container { background: #131318; padding: 25px; border-radius: 16px; width: 100%; max-width: 550px; margin: 15px auto; border: 1px solid #22222a; }
        h3 { color: #ff4500; margin-top: 0; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; background: #1a1a24; border: 1px solid #333; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; background: #ff4500; color: white; margin-top: 10px; }
        .result-box { background: #000; padding: 15px; border-radius: 8px; border-left: 4px solid #30d158; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { color: #888; font-size: 12px; text-align: left; border-bottom: 1px solid #333; padding: 8px; }
        td { padding: 8px; border-bottom: 1px solid #222; font-size: 14px; }
        .row-summary { display: flex; justify-content: space-between; padding: 15px; background: #000; border-radius: 8px; margin-top: 15px; font-weight: bold; color: #30d158; }
    </style>
</head>
<body>

<div class="container">
    <h3>Input Orderan</h3>
    <input type="text" id="nama-reseller" placeholder="Nama Reseller (Contoh: Adit)">
    <input type="text" id="nama-order" placeholder="Nama Konsumen/Orderan">
    <div style="display:flex; gap: 10px;">
        <input type="number" id="lebar" placeholder="Lebar (cm)" oninput="hitungHarga()">
        <input type="number" id="panjang" placeholder="Panjang (cm)" oninput="hitungHarga()">
        <input type="number" id="jumlah" placeholder="Qty" value="1" oninput="hitungHarga()">
    </div>
    <input type="number" id="harga-per-cm" placeholder="Harga Modal per cm²" oninput="hitungHarga()">
    <input type="number" id="biaya-tambahan" placeholder="Biaya Tambahan (Rp)" oninput="hitungHarga()">
    
    <div class="result-box">
        <div>Harga Jual Akhir: <span id="display-harga" style="font-size: 20px; font-weight: bold;">Rp 0</span></div>
    </div>
    
    <button class="btn-main" onclick="simpanOrder()">SIMPAN KE RIWAYAT</button>
</div>

<div class="history-container">
    <h3>Log Riwayat</h3>
    <input type="text" id="search-history" placeholder="🔍 Cari nama reseller di sini..." oninput="renderTabel()">
    <div id="table-wrapper"></div>
    <div class="row-summary">
        <span>TOTAL OMZET FILTER:</span>
        <span id="total-omzet">Rp 0</span>
    </div>
    <button onclick="resetData()" style="background:none; border:none; color:red; cursor:pointer; font-size:12px; margin-top:10px;">Reset Semua Data</button>
</div>

<script>
    let daftarRiwayat = JSON.parse(localStorage.getItem('fastquote_history')) || [];
    let hargaJualTerakhir = 0;

    function hitungHarga() {
        const lb = parseFloat(document.getElementById('lebar').value) || 0;
        const pj = parseFloat(document.getElementById('panjang').value) || 0;
        const qty = parseFloat(document.getElementById('jumlah').value) || 0;
        const hrg = parseFloat(document.getElementById('harga-per-cm').value) || 0;
        const add = parseFloat(document.getElementById('biaya-tambahan').value) || 0;
        
        hargaJualTerakhir = (lb * pj * hrg * qty) + add;
        document.getElementById('display-harga').innerText = "Rp " + hargaJualTerakhir.toLocaleString();
    }

    function simpanOrder() {
        const order = {
            reseller: document.getElementById('nama-reseller').value || "Umum",
            nama: document.getElementById('nama-order').value || "Tanpa Nama",
            jual: hargaJualTerakhir,
            waktu: new Date().toLocaleDateString()
        };
        
        daftarRiwayat.push(order);
        localStorage.setItem('fastquote_history', JSON.stringify(daftarRiwayat));
        renderTabel();
    }

    function renderTabel() {
        const keyword = document.getElementById('search-history').value.toLowerCase();
        const filtered = daftarRiwayat.filter(item => item.reseller.toLowerCase().includes(keyword));
        
        let html = `<table><tr><th>Reseller</th><th>Order</th><th>Harga</th></tr>`;
        let total = 0;
        
        filtered.forEach(item => {
            html += `<tr><td>${item.reseller}</td><td>${item.nama}</td><td>Rp ${item.jual.toLocaleString()}</td></tr>`;
            total += item.jual;
        });
        
        html += `</table>`;
        document.getElementById('table-wrapper').innerHTML = html;
        document.getElementById('total-omzet').innerText = "Rp " + total.toLocaleString();
    }

    function resetData() {
        if(confirm("Yakin ingin menghapus semua riwayat?")) {
            localStorage.removeItem('fastquote_history');
            daftarRiwayat = [];
            renderTabel();
        }
    }

    window.onload = renderTabel;
</script>
</body>
</html>
